name: SDK Ruby

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        ruby: ["3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - name: Save coverage percent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.ruby == '3.2'
        run: ruby -rjson -e 'result=JSON.parse(File.read("coverage/.last_run.json"))["result"]; value=result["line"]||result["covered_percent"]; abort("coverage summary was not found") if value.nil?; File.write("coverage-percent.txt", value.to_s)'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.ruby == '3.2'
        with:
          name: coverage-percent
          path: coverage-percent.txt
          retention-days: 1

  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-percent
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-coverage-badge.sh "$(cat coverage-percent.txt)"
